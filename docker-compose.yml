services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "5173:5173"
    environment:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
      VITE_AUTH_MODE: local
    volumes:
      - ./apps/web:/app/apps/web
      - ./package.json:/app/package.json
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./pnpm-lock.yaml:/app/pnpm-lock.yaml
    networks:
      - supabase

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    ports:
      - "8787:8787"
    environment:
      PUSH_MODE: log
      PUSH_SHARED_SECRET: local-push-secret
      SUPABASE_URL: http://kong:8000
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
    volumes:
      - ./workers/icoparent-worker:/app/workers/icoparent-worker
    networks:
      - supabase

  e2e:
    profiles: ["e2e"]
    image: mcr.microsoft.com/playwright:v1.57.0-jammy
    working_dir: /work
    command: pnpm --filter @icoparent/web exec playwright test
    environment:
      PLAYWRIGHT_BASE_URL: http://web:5173
      SUPABASE_URL: http://kong:8000
    volumes:
      - .:/work
    depends_on:
      - web
      - worker
    networks:
      - supabase

networks:
  supabase:
    external: true
    name: supabase_network_icoparent
