name: Nightly database backup

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump, encrypt, and upload
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/backup"
          dump="$RUNNER_TEMP/backup/icoparent.sql.gz.gpg"
          pg_dump --dbname="$DATABASE_URL" --no-owner --format=plain | gzip | gpg --symmetric --batch --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" --output "$dump"
          aws s3 cp "$dump" "s3://$R2_BUCKET/$(date -u +%F)/icoparent.sql.gz.gpg" --endpoint-url "$R2_ENDPOINT"
          rm -f "$dump"
